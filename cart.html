<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <div class="cart">

        <div class="cart-header">
            <h1>Cart</h1>
            <a href="/index.html">← Back To Shopping</a>
        </div>

        <div class="product">
            <div class="product-image">
                <img src="/591937292_max-removebg-preview 1.png" alt="Black Beats headphones">
            </div>

            <div class="product-info">
                <h2>Beats By Dre</h2>

                <div class="colors">
                    <span class="color black"></span>
                    <span class="color gray"></span>
                    <span class="color blue"></span>
                </div>

                <p class="price">BAM 29.99</p>

                <p class="delivery">
                    <strong>Deliveri Time:</strong>
                    <span>2 work days</span>
                </p>
            </div>
        </div>

        <button class="checkout"><a href="/checkout.html" style="text-decoration: none; color: white;">Checkout</a></button>

    </div>

</body>
</html>
